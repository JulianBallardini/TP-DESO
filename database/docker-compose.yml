services:
  db:
    image: postgres:16
    container_name: capital-humano-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: capital_humano
      POSTGRES_USER: capital
      POSTGRES_PASSWORD: capital123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capital -d capital_humano"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
